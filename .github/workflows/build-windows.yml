name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Generate application icon
        run: python scripts/create_icon.py
      - name: Download Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-assets | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile build-assets/MicrosoftEdgeWebView2Setup.exe
      - name: Build one-file windowed executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --workpath "$env:RUNNER_TEMP\OrbitPilotAI-PyInstaller" OrbitPilotAI.spec
      - name: Smoke-test bundled application
        run: dist/OrbitPilotAI.exe --smoke-test
      - name: Package complete source and executable ZIP
        run: python scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitPilotAI-Windows
          path: |
            dist/OrbitPilotAI.exe
            dist/OrbitPilotAI-Complete.zip
          if-no-files-found: error
